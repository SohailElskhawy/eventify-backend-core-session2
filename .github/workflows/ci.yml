name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint, Typecheck & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventify
          POSTGRES_PASSWORD: "301077"
          POSTGRES_DB: eventify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://eventify:301077@localhost:5432/eventify_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: super-secret-jwt-access-token-key-at-least-32-chars-long
      WEB_ORIGIN: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run database migrations against test DB
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test
